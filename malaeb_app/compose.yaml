services:
  app:
    build: .
    restart: unless-stopped
    environment:
      MALAEb_HOST: 0.0.0.0
      MALAEb_PORT: 8000
      MALAEb_DB: /data/malaeb.sqlite3
      MALAEb_SECURE_COOKIE: "1"
    volumes:
      - malaeb_data:/data
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      MALAEb_DOMAIN: ${MALAEb_DOMAIN:?Set your public domain in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  malaeb_data:
  caddy_data:
  caddy_config:
